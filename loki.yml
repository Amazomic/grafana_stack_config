auth_enabled: false

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    s3:
      endpoint: rustfs:9000
      bucketnames: loki-logs
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      insecure: true
      s3forcepathstyle: true
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

compactor:
  compaction_interval: 1h
  retention_enabled: true
  retention_delete_delay: 24h
  delete_request_store: s3

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 512

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 31d
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  max_line_size: 5MB
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - container_name
            - host

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
  chunk_idle_period: 1h
  max_chunk_age: 2h
  chunk_target_size: 1572864
  chunk_retain_period: 30s

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false

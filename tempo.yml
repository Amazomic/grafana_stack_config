stream_over_http_enabled: true

usage_report:
  reporting_enabled: false    

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: tempo-traces
      endpoint: rustfs:9000
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true

backend_scheduler:
    provider:
        compaction:
            compaction:
                block_retention: 12h

backend_worker:
    compaction:
        block_retention: 12h

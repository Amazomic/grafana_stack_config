services:
  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --console-address ":9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_ENDPOINT: "http://alloy:10051"
    volumes:
      - ${RUSTFS_DATA_PATH:-./rustfs/data}:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure

  init-buckets:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" >/dev/null 2>&1; do
          echo "waiting for rustfs..."; sleep 2
        done
        for b in loki-logs tempo-traces mimir-metrics; do
          /usr/bin/rc ls rustfs/$$b >/dev/null 2>&1 || /usr/bin/rc mb rustfs/$$b
        done
    restart: "no"

  mimir:
    image: grafana/mimir:latest
    hostname: mimir
    command: ["--config.file=/etc/mimir/mimir.yml", "--config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./mimir.yml:/etc/mimir/mimir.yml
      - mimir_data:/data
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: on-failure

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: on-failure

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: on-failure

  alloy:
    image: grafana/alloy:latest
    privileged: true
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    environment:
      - ALLOY_DISABLE_REPORTING=true
      - GRAFANA_HOST=${GRAFANA_HOST:-GRAFANA_LOCAL}
    extra_hosts: ["host.docker.internal:host-gateway"]  
    ports:
      - "10099:10051"
      - "12345:12345"
    depends_on:
      - mimir
      - tempo
      - loki
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - grafana_data:/var/lib/grafana  
    depends_on:
      - mimir
      - tempo
      - loki
    restart: on-failure

volumes:
  mimir_data:
  tempo_data:
  loki_data:
  grafana_data: